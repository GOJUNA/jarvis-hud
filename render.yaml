services:
  - type: web
    name: jarvis-hud
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT web.app:socketio
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/stats
    autoDeploy: true